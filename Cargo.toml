[package]
name = "gray-router"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tiered model router provider plugin for the gray agent harness"

[lib]
name = "gray_router"
path = "src/lib.rs"

[[bin]]
name = "gray-router"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gray-plugin = { git = "https://github.com/vstaln/gray.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
